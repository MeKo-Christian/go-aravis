version = "2"

# Linter configuration tuned for this project: a small CGO binding around the
# Aravis machine-vision library. We run the reliable default linters plus a few
# high-value additions, rather than enabling every opinionated linter.

[linters]
default = "standard"
enable = [
    "bodyclose",
    "misspell",
    "revive",
    "unconvert",
    "unparam",
]

[linters.settings.revive]
# The public API uses SCREAMING_SNAKE_CASE constants that mirror the Aravis C
# enum names, so the Go var-naming rule does not apply here.
[[linters.settings.revive.rules]]
name = "var-naming"
disabled = true

[linters.exclusions]
generated = "lax"
presets = ["comments", "common-false-positives", "legacy", "std-error-handling"]

[[linters.exclusions.rules]]
# Example programs are intentionally terse and ignore errors for readability.
path = "examples/"
linters = ["errcheck"]

[[linters.exclusions.rules]]
# Test helpers frequently ignore errors from best-effort cleanup calls.
path = "_test\\.go"
linters = ["errcheck"]

[formatters]
enable = ["gofmt", "goimports"]
