name: Test

on:
  push:

env:
  # Single source of truth for the Go version; must satisfy the go directive in go.mod.
  GO_VERSION: "1.23"

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Verify Aravis installation
      run: |
        pkg-config --exists aravis-0.8
        pkg-config --modversion aravis-0.8

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-

    - name: Download dependencies
      run: make deps

    - name: Check system requirements
      run: make check-system

    - name: Build library
      run: make build

    - name: Build examples
      run: make examples

    - name: Run unit tests
      run: make test-unit

    - name: Run all tests with coverage
      run: make test-coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Install development tools
      run: make install-tools

    - name: Run linter
      run: make lint

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Build all examples
      run: make examples

    - name: List built examples
      run: make list-examples

    - name: Upload examples artifacts
      uses: actions/upload-artifact@v4
      with:
        name: examples-binaries
        path: bin/
        retention-days: 7

  integration-test:
    name: Integration Test (Mock)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Run integration tests (without cameras)
      run: |
        # Integration tests skip gracefully when no cameras are present.
        make test-short

    - name: Run performance benchmarks
      run: |
        # Benchmarks skip gracefully when no cameras are present.
        make benchmark || echo "Benchmarks completed without cameras"

  docker-test:
    name: Docker Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build Docker image
      run: make docker-build

    - name: Test in Docker container
      run: |
        docker run --rm --entrypoint /bin/bash go-aravis:latest -c "make test-unit"

  build-amd64:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Build for linux/amd64
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 1
      run: make build

    # NOTE: A linux/arm64 job was removed. Cross-compiling this binding requires
    # arm64 Aravis + GLib libraries and a cross toolchain, which the previous
    # placeholder job never provided (it only echoed a message and always failed).
    # Add it back only with a real cross-build setup.

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Advisory scan: it must never block the PR, so failures are tolerated.
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          pkg-config \
          build-essential

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
