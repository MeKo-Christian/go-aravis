name: Test

on:
  push:

env:
  # Single source of truth for the Go version; must satisfy the go directive in go.mod.
  GO_VERSION: "1.23"

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # libaravis-dev provides Aravis 0.8; the extra -dev packages provide the
        # pkg-config modules aravis-0.8.pc requires (libusb-1.0, libxml-2.0, zlib,
        # glib), without which `pkg-config --cflags aravis-0.8` fails.
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Verify Aravis installation
      run: |
        pkg-config --exists aravis-0.8
        pkg-config --modversion aravis-0.8

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-

    - name: Download dependencies
      run: make deps

    - name: Check system requirements
      run: make check-system

    - name: Build library
      run: make build

    - name: Build examples
      run: make examples

    - name: Run unit tests
      run: make test-unit

    - name: Run all tests with coverage
      run: make test-coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Install golangci-lint
      # Installed via `go install` (through the Go module proxy) rather than the
      # curl|sh script, which is prone to checksum failures behind proxies.
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

    - name: Run linter
      run: "$(go env GOPATH)/bin/golangci-lint run --config .golangci.toml"

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Build all examples
      run: make examples

    - name: List built examples
      run: make list-examples

    - name: Upload examples artifacts
      uses: actions/upload-artifact@v4
      with:
        name: examples-binaries
        path: bin/
        retention-days: 7

  fake-backend-test:
    name: Fake Backend Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Run short tests
      run: make test-short

    - name: Run performance benchmarks
      # The benchmarks run against Aravis's Fake backend, so a failure here is
      # a real failure, not "no camera attached". The `|| echo` that used to
      # follow this line hid every one of them. BENCHTIME=10x executes every
      # benchmark body in a few seconds; the timings from a shared runner are
      # not the point.
      run: make benchmark BENCHTIME=10x

    - name: Fail on unexpected skips
      # A skip means the Fake backend was not reachable, which is exactly the
      # order-dependent silence P5 removed. Three skips are documented and
      # allowed, all of them properties of the Fake backend rather than of this
      # binding:
      #
      #   TestMultipleDevices          Fake provides exactly one device
      #   *FirstAvailable              Fake has no first-device (NULL) lookup
      #   TestFastAccessorsMatchStandard/{ExposureTime,Gain}
      #                                Fake exposes no such GenICam node
      #
      # The names are anchored and matched in full. An earlier version of this
      # guard allowed the prefix `TestFastAccessorsMatchStandard/`, which also
      # covered its Width and Height subtests — so those could start skipping
      # without the guard noticing, which is the exact failure it exists to
      # catch.
      #
      # -v is load-bearing too: without it `go test` prints no SKIP lines at
      # all and this guard would pass no matter what.
      run: |
        go test -v ./... 2>&1 | tee test-output.txt
        if grep -E '^\s*--- SKIP' test-output.txt \
             | grep -vE '(^|[[:space:]])(TestMultipleDevices|TestNewCameraFirstAvailable|TestOpenDeviceFirstAvailable|TestFastAccessorsMatchStandard/(ExposureTime|Gain))[[:space:]]*\('; then
          echo "::error::unexpected test skip; the Fake backend may be unavailable"
          exit 1
        fi

    - name: Fail on GLib CRITICAL output
      # GLIB_REUSE_OUTPUT grades test-output.txt from the step above, so the
      # suite is not run a second time. The reuse is opt-in: locally the target
      # re-runs the suite, because a stale log would report a green that no
      # longer corresponds to the working tree. A GLib diagnostic means an
      # Aravis function was called outside its preconditions; tests/README.md
      # has documented this check since P5 but nothing enforced it until now.
      run: make test-glib-clean GLIB_REUSE_OUTPUT=1

  docker-test:
    name: Docker Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build Docker image
      run: make docker-build

    - name: Test in Docker container
      run: |
        docker run --rm --entrypoint /bin/bash go-aravis:latest -c "make test-unit"

  build-amd64:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Build for linux/amd64
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 1
      run: make build

    # NOTE: A linux/arm64 job was removed. Cross-compiling this binding requires
    # arm64 Aravis + GLib libraries and a cross toolchain, which the previous
    # placeholder job never provided (it only echoed a message and always failed).
    # Add it back only with a real cross-build setup.

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Advisory scan: it must never block the PR, so failures are tolerated.
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaravis-dev \
          libglib2.0-dev \
          libxml2-dev \
          zlib1g-dev \
          libusb-1.0-0-dev \
          pkg-config \
          build-essential

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        # G103 flags every use of `unsafe`, which is unavoidable and idiomatic in
        # a CGO binding, so it is excluded to keep the scan signal meaningful.
        #
        # G115 (integer overflow conversion) is excluded because it fires inside
        # cgo's *generated* code, which has no location in this repository: gosec
        # emits a SARIF result with an empty artifactLocation, and the upload step
        # then fails with "locationFromSarifResult: expected artifact location".
        # The finding it reports is `r2 = syscall.Errno(errno)` in the wrapper cgo
        # generates for its two-result call form — not something any file here can
        # annotate or fix.
        args: '-no-fail -exclude=G103,G115 -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
